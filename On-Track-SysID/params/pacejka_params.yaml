pacejka_model:
  C_Pf_model: [7.173657737630526, 1.5628207135320944, 0.3882069183399687, 0.5278435112876324]
  C_Pr_model: [8.288516161529747, 2.109127387401536, 0.3751749393933447, 0.4036016891841555]

pacejka_ref:
  C_Pf_ref: [7.17, 1.56, 0.69, 0.53]
  C_Pr_ref: [8.29, 2.11, 0.68, 0.40]

# Nonlinear least-squares settings for Pacejka identification.
# Defaults are robust for noisy on-track data while keeping runtime low.
pacejka_solver:
  # trf | dogbox | lm            - scipy.optimize.least_squares, gradient-based, fast, local.
  # nelder-mead                  - scipy.optimize.minimize, derivative-free simplex search;
  #                                 same solver arXiv:2603.09399 (this repo's own SOTA
  #                                 follow-on paper) uses for iterative on-track Pacejka
  #                                 extraction. Slower than trf, more robust to a poor
  #                                 initial guess or a noisy/non-smooth cost surface.
  # differential-evolution        - scipy.optimize.differential_evolution, a global
  #                                 population-based search; escapes local minima that
  #                                 multi-start trf/nelder-mead can still miss, at
  #                                 significantly higher runtime cost. Same rationale
  #                                 this repo's own pacejka_identification/
  #                                 coefficient_identifier.py already applies via its
  #                                 genetic-algorithm identifier.
  method: trf 
  loss: soft_l1               # trf/dogbox/lm only - ignored by nelder-mead/differential-evolution
  f_scale: null                # trf/dogbox/lm only
  x_scale: jac                  # trf/dogbox/lm only
  max_nfev: null                 # trf/dogbox/lm (max function evals) / nelder-mead (maps to maxfev)
  num_starts: 1                  # jitter restarts; applies to trf/dogbox/lm/nelder-mead,
                                   # ignored by differential-evolution (already global)
  start_jitter: 0.05
  seed: null                       # also seeds differential-evolution's RNG
  de_popsize: null                  # differential-evolution only; null = scipy default (15)
  de_maxiter: null                  # differential-evolution only; null = scipy default (1000)

# Friction-based cold-start warm-start for the Pacejka D (peak-mu)
# coefficient's initial guess. Applied ONLY ONCE per node lifetime - the
# very first identification cycle (see on_track_sys_id.py's
# self._is_first_identification gate and helpers/friction_warmstart.py).
# Every subsequent reidentification_interval_s retrain is unaffected: it
# keeps cold-starting iteration 1 from pacejka_model's static D value
# exactly as before this feature was added (see train_model.py::nn_train).
# Non-vision analog of arXiv:2603.09399's camera-based friction prior,
# adapted from arXiv:2509.15423's model-free friction-from-acceleration idea.
friction_warm_start:
  enable: true
  method: friction_ratio       # only implementation for now; reserved key for future alternatives
  accel_source: finite_diff    # finite_diff (default, verified working in SIM) | imu (real hardware
                                # only - f1tenth_simulator's own /imu publisher is an unimplemented
                                # stub, see node/simulator.cpp::pub_imu(); falls back to finite_diff
                                # with a warning if no IMU message arrives within imu_wait_timeout_s)
  imu_topic: "/imu"             # only used when accel_source: imu
  imu_wait_timeout_s: 2.0       # only used when accel_source: imu
  low_slip_alpha_f_max: 0.15   # rad — tighter subset of analyse_tires()'s abs(alpha_f)<=0.5
  low_slip_alpha_r_max: 0.08   # rad — tighter subset of analyse_tires()'s abs(alpha_r)<=0.2
  vx_min: 1.5                  # m/s — margin above collect_data()'s own vx>1 gate
  omega_max: 5.0                # rad/s — mirrors analyse_tires()'s abs(omega)<=5 filter
  min_samples: 20                # below this, skip override, fall back to static D default
