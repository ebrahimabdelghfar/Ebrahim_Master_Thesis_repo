/**:
  ros__parameters:
    # =============================================================================
    # Pacejka Magic Formula Coefficient Identification — Configuration
    # =============================================================================

    # ---- Data Collection ----
    data_collection:
      duration_seconds: 60          # How long to collect data (seconds)
      min_velocity: 0.5             # Minimum belt_velocity to accept a sample (m/s)
      require_on_road: true         # Only keep samples where the tire contacts the road
      min_fz_threshold: 50.0        # Minimum |Fz| to accept a sample (N)

    # ---- Identification Settings ----
    identification:
      # Method: trust_region | differential_evolution | dual | genetic_algorithm | ga_trust_region | adaptive_de | adaptive_de_trust_region | bayesian_svi
      # "dual" (recommended) runs differential_evolution first, then refines with trust_region
      # "genetic_algorithm" runs a custom real-coded GA (tournament selection, BLX-α crossover)
      # "ga_trust_region" runs GA first, then refines with trust_region
      # "adaptive_de" runs JADE (self-adaptive F/CR, current-to-pbest/1 mutation, external archive)
      # "adaptive_de_trust_region" runs JADE first, then refines with trust_region
      # "bayesian_svi" runs Stochastic Variational Inference (Pyro) — a correlated
      #                multivariate-normal posterior over the free parameters,
      #                returning both a point estimate and *_std uncertainty
      method: "dual"

      # Identification mode:
      # sequential   (recommended) → fixes C to a physics-based value and D to
      #                               the data peak, fits only B, E
      #                               breaks known parameter degeneracy
      # simultaneous → fits all [B, C, D, E] at once (B/C/E may be correlated)
      identification_mode: "sequential"

      # Regularization for simultaneous mode only (sequential already fixes
      # C and D, so there is nothing to regularize there):
      #   none → plain least squares over the configured lower/upper_bounds
      #   map  → literature-consistent bounds (LITERATURE_BOUNDS) + a
      #          Gaussian-prior penalty anchoring C toward its literature
      #          value (classical MAP estimate) — see map_regularization below
      # method: "bayesian_svi" (below) is a separate, heavier alternative
      # available in both modes; it can be combined with either regularization
      # setting (its own priors are independent of this option).
      regularization: "none"

      # Which Pacejka relationships to identify
      formulas:
        - lateral_fy               # Fy = f(slip_angle, Fz)
        - longitudinal_fx          # Fx = f(long_slip, Fz)
        - self_aligning_mz         # Mz = f(slip_angle, Fz)

      # How to group wheels for identification
      # per_wheel  → FL, FR, RL, RR fitted independently
      # per_axle   → front wheels pooled, rear wheels pooled
      # combined   → all four wheels pooled into one fit
      axle_grouping: "per_wheel"

      # Initial guesses for [B, C, D, E]  (used by trust_region and as seed for dual)
      initial_guess_fy: [10.0, 1.5, 1.0, 0.5]
      initial_guess_fx: [10.0, 1.65, 1.0, 0.5]
      initial_guess_mz: [10.0, 1.5, 0.1, 0.5]

      # Parameter bounds for [B, C, D, E]
      lower_bounds: [0.1, 0.1, 0.01, -2.0]
      upper_bounds: [50.0, 5.0, 5.0, 2.0]

    # ---- Algorithm Hyperparameters ----
    # These control the internal behaviour of each optimiser.
    # The active hyperparameters depend on the chosen 'method' above.
    # Hybrid methods (dual, ga_trust_region) use both the global and trust_region settings.

    trust_region:
      # Maximum number of function evaluations (scipy least_squares TRF)
      max_nfev: 10000

    differential_evolution:
      # Maximum number of DE generations
      maxiter: 1000
      # Convergence tolerance — solver stops early if relative improvement < tol
      tol: 1.0e-12
      # Random seed for reproducibility (set to -1 for non-deterministic)
      seed: 42
      # Whether to polish the DE result with L-BFGS-B (local refinement)
      polish: true

    genetic_algorithm:
      # Number of individuals in the population
      pop_size: 120
      # Number of generations to evolve
      n_generations: 400
      # Probability of BLX-α crossover between two parents
      crossover_rate: 0.85
      # Per-gene probability of Gaussian mutation
      mutation_rate: 0.15
      # Std-dev of mutation as a fraction of the parameter range
      mutation_scale: 0.10
      # Fraction of top individuals preserved via elitism each generation
      elite_frac: 0.05
      # Number of individuals competing in tournament selection
      tournament_size: 3
      # Random seed for reproducibility (set to -1 for non-deterministic)
      seed: 42

    adaptive_de:
      # JADE: Adaptive Differential Evolution (Zhang & Sanderson, 2009)
      # Self-adapts mutation factor F and crossover rate CR per individual.
      # Uses "current-to-pbest/1" mutation and an external archive.
      # Population size
      pop_size: 100
      # Maximum number of generations
      n_generations: 400
      # Top-p fraction for pbest selection (0 < p ≤ 1)
      # Smaller p → more exploitation (greedy), larger p → more exploration
      p: 0.1
      # Adaptation rate for μF and μCR (0 < c ≤ 1)
      # Smaller c → slower adaptation (more stable), larger c → faster adaptation
      c: 0.1
      # Max archive size as fraction of pop_size
      # Archive stores replaced individuals to increase mutation diversity
      archive_ratio: 1.0
      # Random seed for reproducibility (set to -1 for non-deterministic)
      seed: 42

    map_regularization:
      # Only used when identification.regularization == "map" (simultaneous mode).
      # Gaussian-prior penalty weight anchoring C toward its literature value:
      #   cost += lambda_C * ((C - C_literature) / sigma_C)^2
      lambda_C: 1.0
      # Prior std-dev for C (radians of "shape factor" spread — smaller = more anchored)
      sigma_C: 0.3

    bayesian_svi:
      # Stochastic Variational Inference (Pyro): AutoMultivariateNormal guide
      # trained against the ELBO objective (Goblirsch et al., arXiv:2504.20863).
      # Number of gradient steps
      num_steps: 2000
      # Adam learning rate
      learning_rate: 0.01
      # Random seed for reproducibility (set to -1 for non-deterministic)
      seed: 42

    data_balancing:
      # Optional slip-histogram rebalancing applied before fitting (both modes),
      # so a dense near-zero-slip cluster doesn't dominate the fit at the
      # expense of the sparser near-peak region ("prevent overfitting of the
      # linear region", Goblirsch et al., arXiv:2504.20863).
      enabled: false
      # Number of equal-width bins across the observed slip range
      n_bins: 20
      # Max samples kept per bin (over-represented bins are randomly subsampled)
      max_per_bin: 200

    # ---- Output Settings ----
    output:
      csv_export: true              # Export raw dataset to CSV
      csv_path: ""                  # Empty → auto-generated path with timestamp
      yaml_export: true             # Export identified coefficients to YAML
      yaml_path: ""                 # Empty → auto-generated path with timestamp
