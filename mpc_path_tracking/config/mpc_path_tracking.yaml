mpc_path_tracking:
  ros__parameters:

    # ---------------- Topics (all renameable) ----------------
    odom_topic: "/odom"
    waypoint_topic: "/raceline_waypoints"
    drive_topic: "mpc/drive_cmd"                # arbitrated by adaptive_controller_manager onto /drive
    predicted_trajectory_topic: "/mpc/predicted_path"
    status_topic: "/mpc/status"
    debug_topic_prefix: "/mpc/debug"
    enable_topic: "Start_Working_mpc"
    param_service: "mpc/update_params"

    # Managed-mode gating (see adaptive_controller_manager)
    standalone_mode: false

    # ---------------- Horizon / timing ----------------
    horizon:
      N: 50                        # prediction steps
      dt_min: 0.02                 # s, floor is auto-raised to 1/control_rate_hz at
                                    # startup if lower (see ParameterManager::mpcConfig)
      dt_max: 0.07                 # s
      dt_adaptive: true            # dt = clamp(horizon_distance_m / (N * max(vx_ref, v_floor)), dt_min, dt_max)
      horizon_distance_m: 1.3      # target look-ahead distance for the adaptive dt formula
      control_rate_hz: 20.0        # outer ROS timer rate; decoupled from the internal adaptive dt

    # ---------------- Cost matrices ----------------
    # error order: [e_y, e_psi, vx_err, vy, r_err]
    cost:
      Q: [200.0, 200.0, 200.0, 10.0, 10.0]
      R: [10.0, 1.0]                # [steering, accel]
      R_rate: [20.0, 5.0]          # input-rate penalty
      Qf: [200.0, 200.0, 200.0, 10.0, 10.0] #

    # ---------------- Vehicle geometry / mass ----------------
    # Source: On-Track-SysID/models/SIM/SIM_pacejka.txt (identified, matches
    # simulator). Deliberately NOT f1tenth_simulator/params.yaml, whose
    # own comments admit the geometry there is hand-estimated:
    # mass 3.47 (vs 3.54), l_f 0.15875 (vs 0.162), l_r 0.17145 (vs 0.145),
    # Iz 0.04712 (vs 0.05797), h_cg 0.074 (vs 0.02).
    vehicle:
      mass: 3.54       # kg
      Iz: 0.05797      # kg*m^2
      l_f: 0.162       # m, CG to front axle
      l_r: 0.145       # m, CG to rear axle
      h_cg: 0.02       # m, CG height (reserved for future load-transfer extension)

    # ---------------- Pacejka tire model [B,C,D,E] per axle ----------------
    # Source: On-Track-SysID/models/SIM/SIM_pacejka.txt (C_Pf, C_Pr)
    tire:
      Bf: 2.4128
      Cf: 4.8155
      Df: 0.5922
      Ef: 5.0
      Br: 14.4445
      Cr: 1.2129
      Dr: 0.6842
      Er: 0.8526

    # ---------------- Actuator limits / rate limits ----------------
    # Source: f1tenth_simulator/params.yaml (governs actual simulated
    # actuator saturation, so must match exactly for constraint validity)
    limits:
      steering_angle_max: 0.4189   # rad
      steering_angle_min: -0.4189  # rad
      steering_rate_max: 3.2       # rad/s
      speed_max: 8.0               # m/s
      speed_min: 0.0               # m/s
      accel_max: 7.51              # m/s^2
      decel_max: 8.26              # m/s^2 (magnitude; accel_min = -decel_max)
      jerk_max: 1000.0             # m/s^3, effectively unconstrained until tuned

    # ---------------- Solver settings ----------------
    solver:
      backend: "acados"                    # "osqp" | "acados"
      max_iter: 200
      eps_abs: 1.0e-4
      eps_rel: 1.0e-4
      warm_start: true
      polish: true
      time_limit_ms: 15.0                # hard wall-clock budget per solve
      fallback_on_failure: "hold_last"   # "hold_last" | "zero_command" | "brake"

      # Used only when backend == "acados" (see AcadosMpcSolver in
      # solver_interface.hpp). qp_solver picks the linear-QP algorithm acados
      # runs internally: PARTIAL_CONDENSING_HPIPM (default, interior-point,
      # scales well with horizon length), FULL_CONDENSING_HPIPM, or
      # FULL_CONDENSING_QPOASES (active-set; built with ACADOS_WITH_QPOASES=ON,
      # see scripts/thirdparty_lib_build/acados.sh).
      acados:
        qp_solver: "FULL_CONDENSING_QPOASES"
        cond_N: 5                        # partial-condensing block size (PARTIAL_CONDENSING_HPIPM only)
        iter_max: 50
        tol_stat: 1.0e-4
        tol_eq: 1.0e-4
        tol_ineq: 1.0e-4
        tol_comp: 1.0e-4
        warm_start: true
        print_level: 0

    # ---------------- Debug / diagnostics ----------------
    debug:
      enabled: true
      publish_predicted_path: true
      publish_cost_breakdown: true
      log_solve_time: true
      log_level: "info"
