mpc_path_tracking:
  ros__parameters:

    # ---------------- Topics (all renameable) ----------------
    odom_topic: "/odom"
    waypoint_topic: "/raceline_waypoints"
    drive_topic: "mpc/drive_cmd"                # arbitrated by adaptive_controller_manager onto /drive
    predicted_trajectory_topic: "/mpc/predicted_path"
    status_topic: "/mpc/status"
    debug_topic_prefix: "/mpc/debug"
    enable_topic: "Start_Working_mpc"
    param_service: "mpc/update_params"

    # Managed-mode gating (see adaptive_controller_manager)
    standalone_mode: false

    # ---------------- Horizon / timing ----------------
    horizon:
      N: 100                        # prediction steps
      dt_min: 0.02                 # s, floor is auto-raised to 1/control_rate_hz at
      dt_max: 0.07                 # s
      dt_adaptive: true            # dt = clamp(horizon_distance_m / (N * max(vx_ref, v_floor)), dt_min, dt_max)
      horizon_distance_m: 5.5     # target look-ahead distance for the adaptive dt formula
      control_rate_hz: 20.0        # outer ROS timer rate; decoupled from the internal adaptive dt

    # ---------------- Cost matrices ----------------
    # error order: [e_y, e_psi, vx_err, vy, r_err]
    cost:
      Q: [20.0, 10.0, 20.0, 10.0, 10.0]
      R: [100.0, 1.0]                # [steering, accel]
      R_rate: [100.0, 10.0]          # input-rate penalty
      Qf: [20.0, 10.0, 20.0, 10.0, 10.0] #

    # ---------------- Vehicle geometry / mass ----------------
    # NOTE: On-Track-SysID/models/SIM/SIM_pacejka.txt currently carries a
    # DIFFERENT geometry (l_f = l_r = 1.0653, l_wb 2.1305). The sysid fits tire
    # coefficients against its own geometry and then pushes them into this node
    # via mpc/update_params, so the two files must agree or the coefficients get
    # reinterpreted on a different bicycle. The values below are the correct
    # ones - SIM_pacejka.txt is the file that needs updating.
    vehicle:
      mass: 240.0      # kg     - CARLA physics.mass (see note on 204 below)
      Iz: 51.1        # kg*m^2 - ESTIMATED, verify
      l_f: 0.738142      # m, CG to front axle (L/2; 50/50 split ASSUMED)
      l_r: 0.795362      # m, CG to rear axle
      h_cg: 0.31538       # m, CG height - ESTIMATED (reserved for load transfer)

    # ---------------- Pacejka tire model [B,C,D,E] per axle ----------------
    # STARTUP PRIOR ONLY - On-Track-SysID overwrites these at runtime through
    # mpc/update_params. D is the dimensionless peak friction coefficient
    # (Fy = D*Fz), so it comes straight from CARLA's PhysX tire_friction=1.5
    # for vehicle.vehicle.asurt_fsai; B/C/E are generic passenger-tire Magic
    # Formula values. The previous values here (Bf 2.4128, Cf 4.8155,
    # Df 0.5922, Ef 5.0, Br 14.4445, Cr 1.2129, Dr 0.6842, Er 0.8526) were the
    # F1TENTH-era fit for the 3.54 kg RC car and were never updated when the
    # plant became the 240 kg CARLA vehicle. They put peak grip at 0.64 g
    # against the plant's ~1.5 g, so the model needed far more steering than
    # the real car did for the same lateral force -> closed-loop limit cycle.
    tire:
      Bf: 10.0
      Cf: 1.9
      Df: 1.5
      Ef: 0.97
      Br: 10.0
      Cr: 1.9
      Dr: 1.5
      Er: 0.97

    # ---------------- Actuator limits / rate limits ----------------
    limits:
      steering_angle_max: 0.2793   # rad (16 deg)
      steering_angle_min: -0.2793  # rad
      steering_rate_max: 1.0       # rad/s - PLACEHOLDER, measure
      speed_max: 11.1111           # m/s (40 km/h plant cap)
      speed_min: 0.0               # m/s
      accel_max: 14.71             # m/s^2 (mu*g, grip-limited)
      decel_max: 14.71             # m/s^2 (magnitude; accel_min = -decel_max)
      jerk_max: 1000.0             # m/s^3, effectively unconstrained until tuned

    # ---------------- Solver settings ----------------
    solver:
      backend: "acados"                    # "osqp" | "acados"
      max_iter: 200
      eps_abs: 1.0e-4
      eps_rel: 1.0e-4
      warm_start: true
      polish: true
      time_limit_ms: 15.0                # hard wall-clock budget per solve
      fallback_on_failure: "hold_last"   # "hold_last" | "zero_command" | "brake"

      acados:
        qp_solver: "FULL_CONDENSING_QPOASES"
        cond_N: 5                        # partial-condensing block size (PARTIAL_CONDENSING_HPIPM only)
        # For qpOASES this is max_nwsr (working-set recalculations), NOT an
        # SQP/interior-point iteration count. Full condensing with N=100
        # gives a dense QP with 2*N=200 variables, 200 general (rate) rows and
        # 400 bounds; right after a PP->MPC switch the accel bound is active
        # at nearly every stage, so the initial active set alone needs >100
        # recalculations. The old value of 50 returned RET_MAX_NWSR_REACHED
        # -> acados MAXITER -> "QP solve failed". 1000 is qpOASES' own default.
        iter_max: 1000
        tol_stat: 1.0e-4
        tol_eq: 1.0e-4
        tol_ineq: 1.0e-4
        tol_comp: 1.0e-4
        warm_start: true
        print_level: 0

    # ---------------- Debug / diagnostics ----------------
    debug:
      enabled: true
      publish_predicted_path: true
      publish_cost_breakdown: true
      log_solve_time: true
      log_level: "info"
