mpc_path_tracking:
  ros__parameters:

    # ---------------- Topics (all renameable) ----------------
    odom_topic: "/odom"
    waypoint_topic: "/raceline_waypoints"
    drive_topic: "mpc/drive_cmd"                # arbitrated by adaptive_controller_manager onto /drive
    predicted_trajectory_topic: "/mpc/predicted_path"
    status_topic: "/mpc/status"
    debug_topic_prefix: "/mpc/debug"
    enable_topic: "Start_Working_mpc"
    param_service: "mpc/update_params"

    # Managed-mode gating (see adaptive_controller_manager)
    standalone_mode: false

    # ---------------- Horizon / timing ----------------
    horizon:
      N: 20                       # prediction steps
      dt_min: 0.02                 # s, auto-raised to 1/control_rate_hz at startup
      dt_max: 0.07                 # s
      dt_adaptive: false            # dt = clamp(horizon_distance_m / (N * max(vx_ref, v_floor)), dt_min, dt_max)
      horizon_distance_m: 5.5
      control_rate_hz: 20.0

    # ---------------- Cost matrices ----------------
    # error order: [e_y, e_psi, vx_err, vy, r_err]
    # Q[r_err] is the corner-entry stability knob.
    cost:
      Q: [10.0, 5.0, 100.0, 0.0, 100.0]
      R: [10.0, 1.0]                # [steering, accel]
      R_rate: [1000.0, 1.0]          # input-rate penalty
      Qf: [10.0, 5.0, 100.0, 0.0, 100.0] #

    # ---------------- Vehicle geometry / mass ----------------
    vehicle:
      mass: 240.0      # kg     - CARLA physics.mass (see note on 204 below)
      Iz: 51.1        # kg*m^2 - ESTIMATED, verify
      l_f: 0.738142      # m, CG to front axle (L/2; 50/50 split ASSUMED)
      l_r: 0.795362      # m, CG to rear axle
      h_cg: 0.31538       # m, CG height - ESTIMATED (reserved for load transfer)

    # ---------------- Pacejka tire model [B,C,D,E] per axle ----------------
    tire:
      Bf: 10.0
      Cf: 1.9
      Df: 1.5
      Ef: 0.97
      Br: 10.0
      Cr: 1.9
      Dr: 1.5
      Er: 0.97

    # ---------------- Actuator limits / rate limits ----------------
    limits:
      steering_angle_max: 0.2793   # rad (16 deg)
      steering_angle_min: -0.2793  # rad
      steering_rate_max: 1.0       # rad/s - PLACEHOLDER, measure
      speed_max: 31.0             # m/s (100 km/h plant cap)
      speed_min: 0.0               # m/s
      accel_max: 5.71             # m/s^2 (mu*g, grip-limited)
      decel_max: 3.71             # m/s^2 (magnitude; accel_min = -decel_max)
      jerk_max: 1000.0             # m/s^3, effectively unconstrained until tuned
      lateral_accel_max: 6.5       # m/s^2 - UPPER CAP only, see grip_utilization
      grip_utilization: 0.7        # fraction of the identified grip ceiling
      drivetrain_tau_s: 0.2         # s, 0.0 = one control period of accel only
      drivetrain_tau_decel_s: -0.2  # s, <0 = same as drivetrain_tau_s
      drivetrain_tau_auto: false

    # ---------------- Solver settings ----------------
    solver:
      backend: "acados"                    # "osqp" | "acados"
      solve_on_new_odom: true
      max_iter: 200
      eps_abs: 1.0e-4
      eps_rel: 1.0e-4
      warm_start: true
      polish: true
      time_limit_ms: 15.0                # hard wall-clock budget per solve
      fallback_on_failure: "hold_last"   # "hold_last" | "zero_command" | "brake"

      acados:
        qp_solver: "PARTIAL_CONDENSING_HPIPM"
        cond_N: 5                        # partial-condensing block size (PARTIAL_CONDENSING_HPIPM only)
        iter_max: 1000
        tol_stat: 1.0e-4
        tol_eq: 1.0e-4
        tol_ineq: 1.0e-4
        tol_comp: 1.0e-4
        warm_start: true
        print_level: 0

    # ---------------- Debug / diagnostics ----------------
    debug:
      enabled: true
      publish_predicted_path: true
      publish_cost_breakdown: true
      log_solve_time: true
      log_level: "info"
