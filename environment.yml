name: ros2_env
channels:
  - conda-forge
  - pytorch
  - nvidia
  - defaults
dependencies:
  - _libgcc_mutex
  - _openmp_mutex
  - ca-certificates
  - ld_impl_linux-64
  - libffi
  - libgcc-ng
  - libgomp
  - libstdcxx-ng
  - ncurses
  - openssl
  - pip
  - python=3.12
  - readline
  - setuptools
  - sqlite
  - tk
  - wheel
  - xz
  - zlib
  - pytorch
  - pytorch-cuda=12.4   # nvidia channel has no 12.6 build yet; closest available to host's pip-installed torch==2.12.1+cu126. GPU actually usable inside the Docker container only if it's run with the nvidia container runtime (docker/docker_compose.yml already sets NVIDIA_VISIBLE_DEVICES/NVIDIA_DRIVER_CAPABILITIES - assumes the Docker daemon's default runtime is nvidia)
  - pip:
    - numpy<2.0
    - matplotlib
    - sympy
    - scipy
    - pandas
    - scikit-learn
    - tk
    - empy==3.3.4
    - lark
    - tqdm
    - catkin-pkg
    - pyyaml
    - transforms3d