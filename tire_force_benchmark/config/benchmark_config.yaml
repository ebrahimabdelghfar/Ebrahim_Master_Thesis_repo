tire_force_benchmark_node:
  ros__parameters:
    # --- Tire-force (Fy) benchmarking ---
    enable_force_benchmarking: true    # false: no tire_forces_topic (or estimated_fy_topic) subscription at all
    benchmark_mode: internal_pacejka   # internal_pacejka | external_topic
    # CARLA's own per-wheel telemetry (sim_manager_msgs/TireForces) - the same
    # ground truth pacejka_identification collects from. lateral_force is already
    # sign-flipped into the ROS body frame to match slip_angle, so it compares
    # directly against pacejka_formula(c_p*, slip_angle, normal_load).
    tire_forces_topic: /sim/feedback/tire_forces
    estimated_fy_topic: /estimated_tire_force_fy
    external_prediction_lead_samples: 1   # compare estimate[k] with ground_truth[k+lead]
    external_max_queue_size: 2000
    log_interval: 200

    # min_fz_threshold has NO built-in default in code (see docs/tire_force_benchmark.md) -
    # it MUST be set here or on the launch line. Rule of thumb: pick a value well below
    # your vehicle's static per-wheel load (mass*9.81/4 N), just enough to filter
    # near-zero/airborne-wheel samples.
    #
    # This value (50.0 N) matches pacejka_identification's data-collection gate for
    # the CARLA vehicle (per-wheel normal_load runs in the hundreds of N).
    # RECOMPUTE THIS for your own vehicle's mass - e.g. a 3.5kg NUC5 (static
    # per-wheel load ~8.6N) needs ~1.0 instead.
    min_fz_threshold: 50.0

    model_file: ""   # path to a C_Pf/C_Pr(+m/I_z/l_f/l_r/l_wb) yaml, e.g. an
                      # On-Track-SysID models/<car>/<car>_pacejka.txt file

    # Reference/prior model for the pacejka_identified_vs_nominal.png comparison plot
    # only - unlike model_file above, this never seeds c_pf/c_pr/have_identified_params,
    # so it's safe to point at a stale/prior *_pacejka.txt without contaminating the
    # live benchmark. Requires a live identified model (via identified_params_service)
    # to actually produce the plot.
    nominal_model_file: "/home/ebrahim/Ebrahim_Master_Thesis_repo/On-Track-SysID/params/pacejka_params.yaml"

    # What the "Nominal Model" curve in pacejka_identified_vs_nominal.png is:
    #   carla_physx (default) - CARLA's own tire curve, rebuilt from
    #     PxVehicleComputeTireForceDefault at zero longitudinal slip and zero
    #     camber: Fy = mu*Fz*S1(latStiff*|tan(alpha)|/(mu*Fz)), which saturates
    #     at mu*Fz and does NOT fall off past the peak. This is the plant, so
    #     it is the only honest reference for "how far off was the prior".
    #   model_file - the previous behaviour: the Magic Formula set in
    #     nominal_model_file. Note that On-Track-SysID writes its identified
    #     coefficients back into pacejka_params.yaml, so C_Pf_ref there can be
    #     a copy of the identified set and the two curves then coincide.
    nominal_source: carla_physx

    # The bridge publishes CARLA's live per-wheel physics here (latched JSON,
    # republished on every change including a runtime /sim/control/tire_friction
    # command). Whatever arrives on this topic overrides the two fallbacks
    # below, so changing the vehicle config cannot leave the nominal curve stale.
    vehicle_physics_topic: /sim/feedback/vehicle_physics

    # Fallbacks used only until (or unless) that topic is received: CARLA
    # WheelPhysicsControl lat_stiff_value / lat_stiff_max_load (PhysX
    # mLatStiffY / mLatStiffX), here vehicle.vehicle.asurt_fsai's values.
    carla_lat_stiff_value: 17.0
    carla_lat_stiff_max_load: 2.0
    # Peak friction of the nominal curve. <= 0 takes it from the tire_friction
    # field of /sim/feedback/tire_forces - the road-multiplied value the
    # physics step actually uses (~1.05 against the 1.5 configured on this map),
    # and the LATEST one, so a mid-run /sim/control/tire_friction change is
    # followed rather than averaged away (the node warns when it moved).
    carla_tire_friction: 0.0

    # c_pf/c_pr have NO default - leave them unset (as below) to have the node
    # wait for freshly-identified params pushed via identified_params_service
    # (see adaptive_controller_manager's benchmark_update_params_enable/
    # benchmark_update_params_service config) instead of benchmarking a
    # hardcoded/arbitrary model. Uncomment below only for standalone testing
    # without adaptive_controller_manager running:
    # c_pf: [6.63, 1.1052, 0.4316, 0.5193]
    # c_pr: [7.8594, 1.5468, 0.3589, 0.5631]

    # Must match adaptive_controller_manager's benchmark_update_params_service
    # (config/adaptive_controller_manager.yaml) if that forwarding is enabled.
    identified_params_service: "benchmark/update_params"

    csv_output_path: ""

    # --- Vehicle-state (v_y, omega) benchmarking ---
    enable_state_benchmarking: true
    odom_topic: /odom
    ackermann_cmd_topic: /drive
    state_estimate_topic: /benchmarking/state_estimate
    state_sensor_topic: /benchmarking/state_sensor
    state_error_topic: /benchmarking/state_error

    # Minimum v_x for a state-benchmark sample. Slip angle is atan(v_y/v_x), so
    # below ~1 m/s the one-step prediction saturates the tire curve and reports
    # yaw rates of several rad/s against a ground truth of a few tenths - which
    # is the whole low-speed bootstrap phase, and it dominated both the metrics
    # and the head of vehicle_states_timeseries.png. 1.0 matches
    # on_track_sys_id.collect_data()'s own v_x > 1 identification-data gate.
    state_min_speed_mps: 1.0

    # Vehicle model constants (m [kg], I_z [kg.m^2], l_f/l_r/l_wb [m]) - only needed
    # if model_file doesn't already provide them. Leave at 0.0 (disables state
    # benchmarking with a warning) unless you set them or a model_file.
    m: 0.0
    I_z: 0.0
    l_f: 0.0
    l_r: 0.0
    l_wb: 0.0

    # --- Academic plot export (on node shutdown) ---
    plot_output_dir: ""   # set to a directory path to enable PNG export
    plot_max_points: 5000
