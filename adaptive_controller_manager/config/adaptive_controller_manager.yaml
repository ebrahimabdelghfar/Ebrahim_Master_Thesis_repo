adaptive_controller_manager:
  ros__parameters:

    # ---------------- Topics ----------------
    odom_topic: "/odom"
    waypoint_topic: "/raceline_waypoints"
    pp_drive_topic: "pp/drive_cmd"
    mpc_drive_topic: "mpc/drive_cmd"
    pp_state_topic: "pp_state"
    pp_health_topic: "pp_health"
    mpc_status_topic: "/mpc/status"
    sysid_first_run_topic: "sysid/first_run"
    drive_topic: "/drive"                      # sole writer in the stack
    start_working_pp_topic: "Start_Working_pp"
    start_working_mpc_topic: "Start_Working_mpc"
    sysid_update_params_service: "sysid/update_params"
    mpc_update_params_service: "mpc/update_params"

    # ---------------- Safety-gate thresholds ----------------
    control_rate_hz: 50.0

    # Safety 1A: vehicle must be moving above this before arming MPC
    v_min: 1.5                  # m/s

    # Safety 1B: track alignment required before arming MPC
    # 0.1 m was an F1TENTH number (0.3 m wheelbase). The vehicle now driven in
    # CARLA is full-scale, and pure_pursuit - still configured with
    # wheelbase 0.3302 - holds a steady-state |e_y| of roughly 0.1-0.9 m on it,
    # so 0.1 blocked arming almost permanently. Scaled by the wheelbase ratio
    # (0.1 * 2.7/0.307 ~ 0.9) and rounded to 1.0.
    # PROVISIONAL: the right fix is to give pure_pursuit the real vehicle
    # wheelbase so its tracking error drops; tighten this again afterwards.
    e_y_max: 1.0                # m
    # 0.1 rad was the original illustrative default, but live testing on
    # YasMarina showed pure_pursuit's own heading error (it doesn't
    # explicitly minimize heading, only lookahead-point lateral geometry)
    # has a median |heading_error| ~0.09 rad and a p90 of ~0.25 rad under
    # normal driving - 0.1 would essentially never arm. Retuned to 0.3 rad
    # (comfortably above the observed p90) based on that measurement.
    theta_max: 0.34               # rad

    # Safety 2B: /odom staleness cutoff, blocks switching / triggers fallback
    delta_t_state_max: 0.1       # s

    # Safety 3: running-average d(e_y)/dt window (samples) must be < 0 before arming
    error_convergence_window: 20

    # Safety 5A: active-controller silence timeout -> attempt switch to the other
    delta_t_timeout: 1.0         # s

    # Design decision 1: linear speed-ramp duration during handover
    delta_t_switch: 1.0          # s

    # Safety 7: block the PP->MPC handover while a sharp corner is imminent -
    # starting the switch ramp (steering jump + speed blend) right before a
    # tight corner risks the car losing control mid-turn. Looks ahead from
    # the nearest waypoint along the raceline for this distance and blocks
    # arming if any waypoint's curvature exceeds the threshold below.
    corner_lookahead_distance: 3.0   # m
    # YasMarina raceline curvature: median ~0.03 rad/m, p90 ~0.18, max ~0.70 -
    # 0.35 sits just above the p99 tail, so only the tightest hairpins count
    # as "sharp" and block the switch; retune per track/vehicle.
    kappa_max_for_switch: 0.25       # rad/m

    # Global cap on how fast a commanded speed may decrease tick-to-tick -
    # covers the switch ramp, EMERGENCY_HALT, and stale-data fallback, so
    # none of them ever reads as an instant stop.
    max_decel_mps2: 8.26          # m/s^2, matches f1tenth_simulator's max_decel
    # MUST stay in sync with On-Track-SysID's solve_pacejka.PACEJKA_BOUNDS -
    # the D floor was 0.2 here against 0.4 there, so this gate was the looser
    # of the two and would have admitted a fit the identifier itself rejects.
    tire_param_min: [4.0, 1.2, 0.4, -3.0, 4.0, 1.2, 0.4, -3.0]
    tire_param_max: [20.0, 2.2, 2.0, 1.0, 20.0, 2.2, 2.0, 1.0]

    # ---------------- Benchmark forwarding (optional) ----------------
    # If enabled, every accepted sysid/update_params submission is also
    # forwarded (best-effort, fire-and-forget) to a passive benchmarking
    # node (tire_force_benchmark) via the same IdentifiedParam service
    # contract, independent of the PP/MPC arming FSM - that node isn't
    # actuating anything, so it should see every accepted identification
    # immediately rather than wait for a handover window. Off by default.
    benchmark_update_params_enable: false
    benchmark_update_params_service: "benchmark/update_params"
